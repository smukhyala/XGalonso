[project]
name = "xg-alonso-ingestion"
version = "0.1.0"
description = "Official FPL source adapters writing immutable bronze snapshots."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "polars>=1.20,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    "xg-alonso-storage",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
