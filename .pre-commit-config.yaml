repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=256"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: import-boundaries
        name: import boundaries
        entry: uv run lint-imports --config .importlinter
        language: system
        pass_filenames: false

      - id: banned-strings
        name: banned strings (corrected claims must not reappear)
        entry: >
          bash -c '! grep -rniE "3000\+|thousands of candidate features|raw_understat_shots"
          --include="*.md" --include="*.py" . || (echo "banned string found" && exit 1)'
        language: system
        pass_filenames: false
