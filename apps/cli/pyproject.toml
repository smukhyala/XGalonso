[project]
name = "xg-alonso-cli"
version = "0.1.0"
description = "Composition root. Wires every package together behind the `xg` binary."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15,<1",
    "polars>=1.20,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    "xg-alonso-storage",
    "xg-alonso-features",
    "xg-alonso-prediction",
    "xg-alonso-optimization",
    "xg-alonso-explanations",
    "xg-alonso-ingestion",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-storage = { workspace = true }
xg-alonso-features = { workspace = true }
xg-alonso-prediction = { workspace = true }
xg-alonso-optimization = { workspace = true }
xg-alonso-explanations = { workspace = true }
xg-alonso-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
