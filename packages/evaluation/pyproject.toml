[project]
name = "xg-alonso-evaluation"
version = "0.1.0"
description = "Walk-forward backtesting. Measures whether recommendations beat holding."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    "xg-alonso-features",
    "xg-alonso-prediction",
    "xg-alonso-optimization",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-features = { workspace = true }
xg-alonso-prediction = { workspace = true }
xg-alonso-optimization = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
