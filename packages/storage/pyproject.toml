[project]
name = "xg-alonso-storage"
version = "0.1.0"
description = "The ONLY package permitted to import duckdb. Implements the storage protocols."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "polars>=1.20,<2",
    "pyarrow>=18.0",
    "xg-alonso-contracts",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
