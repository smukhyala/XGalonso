[project]
name = "xg-alonso-explanations"
version = "0.1.0"
description = "Converts structured evidence into reason codes and grounded prose."
requires-python = ">=3.12"
dependencies = [
    "xg-alonso-contracts",
    "xg-alonso-domain",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
