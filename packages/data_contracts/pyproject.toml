[project]
name = "xg-alonso-contracts"
version = "0.1.0"
description = "Shared schemas, protocols and reason codes. The only package every other may depend on."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "polars>=1.20,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
