[project]
name = "xg-alonso-features"
version = "0.1.0"
description = "Deterministic, point-in-time-safe candidate feature generation."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "polars>=1.20,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    "xg-alonso-storage",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
