[project]
name = "xg-alonso-domain"
version = "0.1.0"
description = "Pure FPL and football rules. No database, no API, no I/O."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "xg-alonso-contracts",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
