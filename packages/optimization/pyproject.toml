[project]
name = "xg-alonso-optimization"
version = "0.1.0"
description = "The decision layer. Turns predictions into legal, ranked recommendations."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    "xg-alonso-prediction",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-prediction = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
