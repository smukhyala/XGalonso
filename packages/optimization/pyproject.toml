[project]
name = "xg-alonso-optimization"
version = "0.1.0"
description = "The decision layer. Turns predictions into legal, ranked recommendations."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "polars>=1.20,<2",
    "scipy>=1.11,<2",
    "xg-alonso-contracts",
    "xg-alonso-domain",
    # The recommendation contract requires at least one grounded reason, so the
    # optimizer must build reasons. It shares one builder with the per-player
    # explanation rather than keeping a second copy, because two builders over
    # the same evidence are two chances to describe the same player differently.
    "xg-alonso-explanations",
    "xg-alonso-prediction",
]

[tool.uv.sources]
xg-alonso-contracts = { workspace = true }
xg-alonso-domain = { workspace = true }
xg-alonso-explanations = { workspace = true }
xg-alonso-prediction = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_alonso"]
